name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: License check
        run: |
          if [ -f "LICENSE" ]; then
            echo "[OK] LICENSE present"
          else
            echo "[NO] LICENSE missing" && exit 1
          fi

      - name: README check
        run: |
          if [ -f "README.md" ] || [ -f "README_zh.md" ]; then
            echo "[OK] README present"
          else
            echo "[WARN] README missing"
          fi

      - name: NOTICE check
        run: |
          if [ -f "NOTICE" ]; then
            echo "[OK] NOTICE present"
          else
            echo "[WARN] NOTICE missing"
          fi

      - name: TypeScript build check
        run: |
          if [ -f "package.json" ]; then
            npm install 2>&1 || echo "[WARN] npm install failed"
            if [ -f "tsconfig.json" ]; then
              npx tsc --noEmit 2>&1 || echo "[WARN] tsc check failed (may need cross-module deps)"
            fi
          else
            echo "[INFO] No package.json, skipping build"
          fi
